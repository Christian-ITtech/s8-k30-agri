    <main class="main-content">

        <!-- HEADER -->

        <header class="topbar">

            <div class="left">

                <button class="menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>

                    <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <div class="right">

                <button class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                </button>

        <!-- =====================================================================
         FORMULAIRE DE PAIEMENT — TODO (Dev FS4)

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->

    <div class="formulaire">
      <h2>FORMULAIRE DE PAIEMENT</h2>
     <form id="form-paiement" class="champ">
      <select id="p-membre" required>
        <option value="">-- Choisir un membre --</option>
      </select> <br><br>
      <input type="number" id="p-montant" min="1" placeholder="Montant (FCFA)" required><br><br>
      <select id="p-mode-paiement" required>
        <option value="">-- Mode de paiement --</option>
        <option value="Espèces">Esspèces</option>
        <option value="Mobile Money">Mobile Money</option>
      </select> <br><br>
      <button type="submit">Enregistrer</button>
      </form>
    </div>

    <div id="message-erreur-paiement" hidden></div>
    <div id="message-succes-paiement" hidden></div>

    <!-- =====================================================================
         TOTAL ET HISTORIQUE — TODO (Dev FS4)

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->

     <h2 id="Historique">Historique de paiement</h2>
    <table>
      <thead>
        <!-- TODO (Dev FS4) : en-têtes (Membre, Montant, Mode de paiement, Date) -->
         <tr>
          <th>Membre</th>
          <th>Montant</th>
          <th>Mode</th>
          <th>Date</th>
         </tr>
      </thead>
      <tbody id="liste-paiements"></tbody>
    </table>
