<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Tableau de bord</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- =====================================================================
    NAVIGATION — TODO (Dev FS1)
    Construire un menu de navigation vers les 8 pages du site.
    Structure attendue : <nav> avec liens vers les autres modules.
    Doit inclure un menu burger pour mobile.
  ===================================================================== -->
  <div class="dashboard">
    <!-- =========================
      SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="../assets/logo-complète.png" alt="COMAKI">
        <h2>K30 AGRI</h2>
        <span>Plateforme Agricole</span>
      </div>

      <nav>
        <ul>
          <li class="active"><a href="../dashboard/dashboard.html">Tableau de bord</a></li>
          <li><a href="../membres/membres.html">Membres</a></li>
          <li><a href="../livraisons/livraisons.html">Livraisons</a></li>
          <li><a href="../paiements/paiements.html">Paiements</a></li>
          <li><a href="../ventes/ventes.html">Ventes & Stock</a></li>
          <li><a href="../statistiques/statistiques.html">Statistiques</a></li>
        </ul>
      </nav>
    </aside>
    <!-- =========================
      CONTENU
    ========================== -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Tableau de bord</h1>
          <p>Bienvenue sur AgriCoop Connect</p>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn">🔔</button>
          <button class="icon-btn">📩</button>
          <div class="user-profile">
            <img src="../assets/logo-sans-intitulé.png" alt="Utilisateur">
            <div>
              <h4>Jean Mukendi</h4>
              <span>Secrétaire</span>
            </div>
        </div>

        <button class="menu-btn">☰</button>
      </header>

      <!-- =====================================================================
        CARTES INDICATEURS — TODO (Dev FS1)
        Construire 4 cartes affichant les indicateurs clés du tableau de bord.
        Structure attendue : conteneur avec 4 éléments (stock, montant dû,
        membres actifs, livraisons du mois).
        Layout : Flexbox ou Grid, responsive (1 colonne mobile, 2-4 desktop).

        *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
      ===================================================================== -->
      <!-- =========================
        CARTES
      ========================== -->
    
      <section id="dashboard-cartes">
        <div id="carte-stock"></div>
        <div id="carte-montant-du"></div>
        <div id="carte-membres"></div>
        <div id="carte-livraisons"></div>
      </section>

      <!-- =====================================================================
        JOURS À FORTE ACTIVITÉ — TODO (Dev FS1)
        Afficher le nombre de jours dépassant le seuil de 80 kg.

        *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
      ===================================================================== -->
      <!-- =========================
        GRILLE
      ========================== -->
      <section class="dashboard-grid">

        <div class="dashboard-card">
          <h2>Jours à forte activité</h2>
          <div id="jours-actifs"></div>
        </div>

        <!-- =====================================================================
          GRAPHIQUE SEMAINE — TODO (Dev FS1)
          Conteneur pour un graphique en barres (barres générées par main.js).
          Le dev doit styliser les barres via CSS (.barre).

          *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
        ===================================================================== -->

        <div class="dashboard-card">
          <h2>Activité hebdomadaire</h2>
          <div id="graphique-semaine"></div>
        </div>

      </section>
    </main>

  </div>
    
  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
